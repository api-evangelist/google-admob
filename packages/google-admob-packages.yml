notes: >-
  Google ships no bespoke "AdMob SDK" for the REST management/reporting API.
  Instead the AdMob API is covered by Google's generated API-client families: two
  ecosystems (Ruby, .NET) publish a dedicated per-API package generated directly
  from the AdMob Discovery Document, and the rest (Node.js, Python, Go, PHP,
  Java, Objective-C) reach AdMob through one umbrella client that carries every
  Google REST API at once. Version and published date below were read from each
  registry's metadata endpoint on 2026-08-13.
  DECAY SIGNAL: the Java per-API artifact com.google.apis:google-api-services-admob
  is pinned at v1-rev20240514-2.0.0 — generated from the 2024-05-14 Discovery
  revision, more than two years behind the live revision 20260731 this repo
  harvested. Java callers using that artifact are working from a stale contract.
  Do NOT confuse anything below with the Google Mobile Ads SDK
  (com.google.android.gms:play-services-ads, Google-Mobile-Ads-SDK,
  google_mobile_ads) — that is the client-side ad-serving SDK an app embeds, a
  different surface from admob.googleapis.com, and it is recorded separately at
  the bottom of this file rather than counted as an API client library.
