          readOnly: true
        name:
          type: string
          description: 'Resource name of this ad unit mapping. Format is: accounts/{publisher_id}/adUnits/{ad_unit_id_fragment}/adUnitMappings/{ad_unit_mapping_id}
            Example: accounts/pub-1234567890123456/adUnits/0123456789/adUnitMappings/987654321'
    MediationGroupTargeting:
      type: object
      description: Set of criteria targeted by this mediation group. For example, a mediation group can target specific
        ad unit IDs, platform, format and geo location.
      properties:
        targetedRegionCodes:
          type: array
          description: The Unicode country/region code (CLDR) of a location, such as "US". Unset if this mediation
            group targets all available regions. For more information, see http://www.unicode.org/reports/tr35/#unicode_region_subtag.
          items:
            type: string
        platform:
          type: string
          description: 'Describes the platform of the app. Examples: "IOS", "ANDROID".'
        format:
          type: string
          description: 'Ad format targeted by this mediation group. Examples: "BANNER", "NATIVE".'
        adUnitIds:
          type: array
          description: 'Ad units targeted by this mediation group. Example: "ca-app-pub-1234/8790".'
          items:
            type: string
        excludedRegionCodes:
          type: array
          description: The Unicode country/region code (CLDR) of a location, such as "US". Unset if this mediation
            group does not exclude any region.
          items:
            type: string
        idfaTargeting:
          type: string
          description: The parameter can be used to target ad requests based on the availability of the IDFA. If
            set to ALL, the mediation group applies to all ad requests (with or without IDFA). If set to AVAILABLE,
            the mediation group applies to ad requests with IDFA. If set to NOT_AVAILABLE, the mediation group applies
            to ad requests without IDFA. Doesn't need to be specified for an ANDROID device.
          enum:
          - IDFA_TARGETING_UNSPECIFIED
          - ALL
          - AVAILABLE
          - NOT_AVAILABLE
          x-enum-descriptions:
          - Default value. This value is unused.
          - All the devices are targeted, regardless of IDFA availability.
          - Only the devices with IDFA availability are targeted.
          - Only the devices without IDFA availability are targeted.
    ReportHeader:
