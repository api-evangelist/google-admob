          $ref: '#/components/schemas/ReportFooter'
    App:
      type: object
      description: 'Describes an AdMob app for a specific platform (For example: Android or iOS).'
      properties:
        name:
          type: string
          description: 'Resource name for this app. Format is accounts/{publisher_id}/apps/{app_id_fragment} Example:
            accounts/pub-9876543210987654/apps/0123456789'
        appId:
          type: string
          description: 'The externally visible ID of the app which can be used to integrate with AdMob. This is
            a read only property. Example: ca-app-pub-9876543210987654~0123456789'
        platform:
          type: string
          description: Describes the platform of the app. Limited to "IOS" and "ANDROID".
        appApprovalState:
