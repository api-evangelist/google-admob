          enum:
          - VARIANT_CHOICE_UNSPECIFIED
          - VARIANT_CHOICE_A
          - VARIANT_CHOICE_B
          x-enum-descriptions:
          - Default value for an unset field. Do not use.
          - Use the mediation lines from Variant A and complete the experiment. Variant A contains the original
            serving lines before the experiment creation.
          - Use the mediation lines form Variant B and complete the experiment. Variant B contains the newly added
            serving lines.
