    CampaignReportSpec:
      type: object
      description: 'The specification for generating a Campaign report. For example, the specification to get IMPRESSIONS
        and CLICKS sliced by CAMPAIGN_ID can look like the following example: { "date_range": { "start_date": {"year":
        2021, "month": 12, "day": 1}, "end_date": {"year": 2021, "month": 12, "day": 30} }, "dimensions": ["CAMPAIGN_ID"],
        "metrics": ["IMPRESSIONS", "CLICKS"], }'
      properties:
        dateRange:
          $ref: '#/components/schemas/DateRange'
        dimensions:
          type: array
          description: List of dimensions of the report. The value combination of these dimensions determines the
            row of the report. If no dimensions are specified, the report returns a single row of requested metrics
            for the entire account.
          items:
            type: string
            enum:
            - DIMENSION_UNSPECIFIED
            - DATE
            - CAMPAIGN_ID
            - CAMPAIGN_NAME
            - AD_ID
            - AD_NAME
            - PLACEMENT_ID
            - PLACEMENT_NAME
            - PLACEMENT_PLATFORM
            - COUNTRY
            - FORMAT
            x-enum-descriptions:
            - Default value of an unspecified dimension. Do not use.
            - A date in the YYYYMMDD format (for example, "20210701").
            - The unique ID of the campaign, for example "123456789", which is consistent with the campaign id from
              campaign list api.
            - The name of the campaign.
            - The unique ID of the ad, for example "123456789".
            - The name of the ad, which may not be unique.
            - The vendor-specific unique ID of the app where the ad is placed. For example, com.goog.bar for Android
              and 123456789 for iOS apps.
            - The name of the app where the ad is placed.
            - The platform of the app where the ad is placed.
            - The name of the targeted country.
            - Format of the ad unit (for example, "banner", "native"), an ad delivery dimension.
        metrics:
          type: array
          description: List of metrics of the report. A report must specify at least one metric.
          items:
            type: string
            enum:
            - METRIC_UNSPECIFIED
            - IMPRESSIONS
            - CLICKS
            - CLICK_THROUGH_RATE
            - INSTALLS
            - ESTIMATED_COST
            - AVERAGE_CPI
            - INTERACTIONS
            x-enum-descriptions:
            - Default value for an unset field. Do not use.
            - The number of times an ad is shown to the user.
            - The number of times a user clicks an ad.
            - The number of clicks an ad receives divided by the number of times the ad is shown.
            - The number of times apps were downloaded to devices.
            - The estimated cost of serving a campaign ad instead of an ad that earns revenue. The currency is the
              reporting currency for campaigns.
            - The average cost per install. This means the average amount that was spent to acquire a new user.
              The currency is the reporting currency for campaigns.
            - The number of times a user interacts with an ad. This consists of clicks and engagements.
        languageCode:
          type: string
          description: Language used for any localized text, such as certain applicable dimension values. The language
            tag is defined in the IETF BCP47. Defaults to 'en-US' if unspecified or invalid.
