        name:
          type: string
          description: Resource name of this account. Format is accounts/{publisher_id}.
        currencyCode:
          type: string
          description: Currency code of the earning-related metrics, which is the 3-letter code defined in ISO 4217.
            The daily average rate is used for the currency conversion.
    GenerateMediationReportRequest:
      type: object
      description: Request to generate an AdMob Mediation report.
      properties:
        reportSpec:
          $ref: '#/components/schemas/MediationReportSpec'
    ReportWarning:
      type: object
      description: Warnings associated with generation of the report.
      properties:
        type:
          type: string
          description: Type of the warning.
          enum:
          - TYPE_UNSPECIFIED
          - DATA_BEFORE_ACCOUNT_TIMEZONE_CHANGE
          - DATA_DELAYED
          - OTHER
          - REPORT_CURRENCY_NOT_ACCOUNT_CURRENCY
          x-enum-descriptions:
          - Default value for an unset field. Do not use.
          - Some data in this report is aggregated based on a time zone different from the requested time zone.
            This could happen if a local time-zone report has the start time before the last time this time zone
            changed. The description field will contain the date of the last time zone change.
          - There is an unusual delay in processing the source data for the requested date range. The report results
            might be less up to date than usual. AdMob is aware of the issue and is actively working to resolve
            it.
          - Warnings that are exposed without a specific type. Useful when new warning types are added but the API
            is not changed yet.
          - The currency being requested is not the account currency. The earning metrics will be based on the requested
            currency, and thus not a good estimation of the final payment anymore, due to the currency rate fluctuation.
        description:
          type: string
          description: Describes the details of the warning message, in English.
    StopMediationAbExperimentRequest:
