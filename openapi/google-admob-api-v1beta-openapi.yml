components:
  schemas:
    BatchCreateAdUnitMappingsResponse:
      type: object
      description: Response containing a batch of created ad unit mappings.
      properties:
        adUnitMappings:
          type: array
          description: The Ad units mappings created under the requested account.
          items:
            $ref: '#/components/schemas/AdUnitMapping'
    Date:
      type: object
      description: 'Represents a whole or partial calendar date, such as a birthday. The time of day and time zone
        are either specified elsewhere or are insignificant. The date is relative to the Gregorian Calendar. This
        can represent one of the following: * A full date, with non-zero year, month, and day values. * A month
        and day, with a zero year (for example, an anniversary). * A year on its own, with a zero month and a zero
        day. * A year and month, with a zero day (for example, a credit card expiration date). Related types: *
        google.type.TimeOfDay * google.type.DateTime * google.protobuf.Timestamp'
      properties:
        year:
          type: integer
          format: int32
          description: Year of the date. Must be from 1 to 9999, or 0 to specify a date without a year.
        month:
          type: integer
          format: int32
          description: Month of a year. Must be from 1 to 12, or 0 to specify a year without a month and day.
        day:
          type: integer
          format: int32
          description: Day of a month. Must be from 1 to 31 and valid for the year and month, or 0 to specify a
            year by itself or a year and month where the day isn't significant.
    LocalizationSettings:
      type: object
      description: Localization settings for reports, such as currency and language. It affects how metrics are
        calculated.
      properties:
        currencyCode:
          type: string
          description: Currency code of the earning related metrics, which is the 3-letter code defined in ISO 4217.
            The daily average rate is used for the currency conversion. Defaults to the account currency code if
            unspecified.
        languageCode:
          type: string
          description: Language used for any localized text, such as some dimension value display labels. The language
            tag defined in the IETF BCP47. Defaults to 'en-US' if unspecified.
    BatchCreateAdUnitMappingsRequest:
      type: object
      description: Request to create a batch of ad unit mappings under the specific AdMob account.
      properties:
        requests:
          type: array
          description: Required. The request message specifying the ad unit mappings to create. A maximum of 100
            ad unit mappings can be created in a batch. If the number of ad unit mappings in the batch request exceed
            100, the entire request will be rejected and no ad unit mappings will be created.
          items:
            $ref: '#/components/schemas/CreateAdUnitMappingRequest'
    MediationReportSpec:
      type: object
      description: 'The specification for generating an AdMob Mediation report. For example, the specification to
        get observed ECPM sliced by ad source and app for the ''US'' and ''CN'' countries can look like the following
        example: { "date_range": { "start_date": {"year": 2021, "month": 9, "day": 1}, "end_date": {"year": 2021,
        "month": 9, "day": 30} }, "dimensions": ["AD_SOURCE", "APP", "COUNTRY"], "metrics": ["OBSERVED_ECPM"], "dimension_filters":
        [ { "dimension": "COUNTRY", "matches_any": {"values": [{"value": "US", "value": "CN"}]} } ], "sort_conditions":
        [ {"dimension":"APP", order: "ASCENDING"} ], "localization_settings": { "currency_code": "USD", "language_code":
        "en-US" } } For a better understanding, you can treat the preceding specification like the following pseudo
        SQL: SELECT AD_SOURCE, APP, COUNTRY, OBSERVED_ECPM FROM MEDIATION_REPORT WHERE DATE >= ''2021-09-01'' AND
        DATE <= ''2021-09-30'' AND COUNTRY IN (''US'', ''CN'') GROUP BY AD_SOURCE, APP, COUNTRY ORDER BY APP ASC;'
      properties:
        maxReportRows:
          type: integer
          format: int32
          description: Maximum number of report data rows to return. If the value is not set, the API returns as
            many rows as possible, up to 100000. Acceptable values are 1-100000, inclusive. Values larger than 100000
            return an error.
        timeZone:
          type: string
          description: A report time zone. Accepts an IANA TZ name values, such as "America/Los_Angeles." If no
            time zone is defined, the account default takes effect. Check default value by the get account action.
            **Warning:** The "America/Los_Angeles" is the only supported value at the moment.
        dimensionFilters:
          type: array
          description: Describes which report rows to match based on their dimension values.
          items:
            $ref: '#/components/schemas/MediationReportSpecDimensionFilter'
        dimensions:
          type: array
          description: List of dimensions of the report. The value combination of these dimensions determines the
            row of the report. If no dimensions are specified, the report returns a single row of requested metrics
            for the entire account.
          items:
            type: string
            enum:
            - DIMENSION_UNSPECIFIED
            - DATE
            - MONTH
            - WEEK
            - AD_SOURCE
            - AD_SOURCE_INSTANCE
            - AD_UNIT
            - APP
            - MEDIATION_GROUP
            - COUNTRY
            - FORMAT
            - PLATFORM
            - MOBILE_OS_VERSION
            - GMA_SDK_VERSION
            - APP_VERSION_NAME
            - SERVING_RESTRICTION
            x-enum-descriptions:
            - Default value for an unset field. Do not use.
            - A date in the YYYYMMDD format (for example, "20210701"). Requests can specify at most one time dimension.
            - A month in the YYYYMM format (for example, "202107"). Requests can specify at most one time dimension.
            - The date of the first day of a week in the YYYYMMDD format (for example, "20210701"). Requests can
              specify at most one time dimension.
            - The [unique ID of the ad source](/admob/api/v1/ad_sources) (for example, "5450213213286189855" and
              "AdMob Network" as label value).
            - The unique ID of the ad source instance (for example, "ca-app-pub-1234:asi:5678" and "AdMob (default)"
              as label value).
            - The unique ID of the ad unit (for example, "ca-app-pub-1234/8790"). If AD_UNIT dimension is specified,
              then APP is included automatically.
            - The unique ID of the mobile application (for example, "ca-app-pub-1234~1234").
            - The unique ID of the mediation group (for example, "ca-app-pub-1234:mg:1234" and "AdMob (default)"
              as label value).
            - CLDR country code of the place where the ad views/clicks occur (for example, "US" or "FR"). This is
              a geography dimension.
            - Format of the ad unit (for example, "banner", "native"), an ad delivery dimension.
            - Mobile OS platform of the app (for example, "Android" or "iOS").
            - Mobile operating system version, e.g. "iOS 13.5.1".
            - GMA SDK version, e.g. "iOS 7.62.0".
            - For Android, the app version name can be found in versionName in PackageInfo. For iOS, the app version
              name can be found in CFBundleShortVersionString.
            - Restriction mode for ads serving (e.g. "Non-personalized ads").
        metrics:
          type: array
          description: List of metrics of the report. A report must specify at least one metric.
          items:
            type: string
            enum:
            - METRIC_UNSPECIFIED
            - AD_REQUESTS
            - CLICKS
            - ESTIMATED_EARNINGS
            - IMPRESSIONS
            - IMPRESSION_CTR
            - MATCHED_REQUESTS
            - MATCH_RATE
            - OBSERVED_ECPM
            x-enum-descriptions:
            - Default value for an unset field. Do not use.
            - The number of requests. The value is an integer.
            - The number of times a user clicks an ad. The value is an integer.
            - The estimated earnings of the AdMob publisher. The currency unit (USD, EUR, or other) of the earning
              metrics are determined by the localization setting for currency. The amount is in micros. For example,
              $6.50 would be represented as 6500000. Estimated earnings per mediation group and per ad source instance
              level is supported dating back to October 20, 2019. Third-party estimated earnings will show 0 for
              dates prior to October 20, 2019.
            - The total number of ads shown to users. The value is an integer.
            - The ratio of clicks over impressions. The value is a double precision (approximate) decimal value.
            - The number of times ads are returned in response to a request. The value is an integer.
            - The ratio of matched ad requests over the total ad requests. The value is a double precision (approximate)
              decimal value.
            - The third-party ad network's estimated average eCPM. The currency unit (USD, EUR, or other) of the
              earning metrics are determined by the localization setting for currency. The amount is in micros.
              For example, $2.30 would be represented as 2300000. The estimated average eCPM per mediation group
              and per ad source instance level is supported dating back to October 20, 2019. Third-party estimated
              average eCPM will show 0 for dates prior to October 20, 2019.
        localizationSettings:
          $ref: '#/components/schemas/LocalizationSettings'
        dateRange:
          $ref: '#/components/schemas/DateRange'
        sortConditions:
          type: array
          description: Describes the sorting of report rows. The order of the condition in the list defines its
            precedence; the earlier the condition, the higher its precedence. If no sort conditions are specified,
            the row ordering is undefined.
          items:
            $ref: '#/components/schemas/MediationReportSpecSortCondition'
    MediationGroupMediationGroupLine:
      type: object
      description: Settings for an ad network used by a mediation group.
      properties:
        cpmMicros:
          type: string
          format: int64
          description: The CPM for this allocation line. $0.01 is the minimum allowed amount. For LIVE CPM modes,
            the default amount is $0.01. This value is ignored if `cpm_mode` is `LIVE`. **Warning:** "USD" is the
            only supported currency at the moment. The unit is in micros.
        adSourceId:
          type: string
          description: The ID of the ad source this mediation line is associated with.
        experimentVariant:
          type: string
          description: Output only. The Mediation A/B experiment variant to which the mediation group line belongs
            to.
          enum:
          - VARIANT_UNSPECIFIED
          - VARIANT_A
          - VARIANT_B
          - ORIGINAL
          x-enum-descriptions:
          - Default value for an unset field. Do not use.
          - The mediation group line belongs to the variant A.
          - The mediation group line belongs to the variant B.
          - The mediation group line isn't a part of an experiment.
          readOnly: true
        displayName:
          type: string
          description: User-provided label for this mediation line. The maximum length allowed is 255 characters.
        adUnitMappings:
          type: object
          description: References of the ad unit mappings for each ad unit associated with this mediation line.
            Key is the ad unit ID, value is resource name of the ad unit mapping. For mediation lines where the
            ad source id is the AdMob Network, ad unit mappings will be ignored.
          additionalProperties:
            type: string
        id:
          type: string
          description: The 16 digit ID for this mediation line e.g. 0123456789012345. When creating a new mediation
            group line, use a distinct negative integer as the ID place holder.
        state:
          type: string
          description: The status of the mediation group line. Only enabled mediation group lines will be served.
          enum:
          - STATE_UNSPECIFIED
          - ENABLED
          - DISABLED
          - REMOVED
          x-enum-descriptions:
          - Default value for an unset field. Do not use.
          - The mediation group line is active and used to serve ads.
          - The mediation group line has been disabled and is no longer served. Disabled mediation group lines can
            be re-enabled.
          - The mediation group line will be removed and no longer served. Removed mediation group lines can not
            be re-enabled and will no longer be visible. This is an input only field.
        cpmMode:
          type: string
          description: Indicates how the CPM for this mediation line is provided. Note that `MANUAL` and `LIVE`
            are the only fully-supported mode at the moment. Please use the AdMob UI (https://admob.google.com)
            if you wish to create or update to other cpm modes.
          enum:
          - CPM_MODE_UNSPECIFIED
          - LIVE
          - MANUAL
          - ANO
          x-enum-descriptions:
          - Default value for an unset field. Do not use.
          - CPM is calculated per ad request based on the ad auction.
          - CPM is set by the user manually.
          - CPM is retrieved from the ad network using the publisher specified credentials. Output only.
    GenerateNetworkReportRequest:
      type: object
      description: Request to generate an AdMob Network report.
      properties:
        reportSpec:
          $ref: '#/components/schemas/NetworkReportSpec'
    MediationAbExperiment:
      type: object
      description: The mediation A/B experiment.
      properties:
        displayName:
          type: string
          description: The display name for the mediation A/B experiment.
        mediationGroupId:
          type: string
          description: Output only. The mediation group id this experiment belongs to. This can be used for filtering
            the experiments in the list experiments API.
          readOnly: true
        endTime:
          type: string
          format: google-datetime
          description: Output only. The time at which the experiment was ended or target to end (in UTC).
          readOnly: true
        name:
          type: string
          description: 'Resource name for this experiment. The format is accounts/{publisher_id}/ mediationGroups/{mediation_group_id}/mediationAbExperiment/
            {mediation_group_experiment_id}. For example: accounts/pub-9876543210987654/mediationGroups/0123456789/
            mediationAbExperiment/12345'
        experimentId:
          type: string
          description: Output only. Unique identifier for the mediation A/B experiment. It is an output only property.
          readOnly: true
        treatmentTrafficPercentage:
          type: string
          format: int64
          description: The percentage of the mediation A/B experiment traffic that will be send to the treatment
            (variant B). The remainder is sent to the control (variant A). The percentage is expressed as an integer
            in the inclusive range of [1,99]. See https://support.google.com/admob/answer/9572326 for details.
        controlMediationLines:
          type: array
          description: Output only. The experiment mediation lines for control. They are inherited from the parent
            mediation group. It is an output only field.
          readOnly: true
          items:
            $ref: '#/components/schemas/MediationAbExperimentExperimentMediationLine'
        startTime:
          type: string
          format: google-datetime
          description: Output only. The time at which the experiment was started (in UTC).
          readOnly: true
        treatmentMediationLines:
          type: array
          description: The experiment mediation lines created for the treatment. They will be used for serving when
            the experiment status is RUNNING.
          items:
            $ref: '#/components/schemas/MediationAbExperimentExperimentMediationLine'
        state:
          type: string
          description: Output only. The state of the experiment. It is an output only field.
          enum:
          - EXPERIMENT_STATE_UNSPECIFIED
          - EXPIRED
          - RUNNING
          - ENDED
          x-enum-descriptions:
          - Default for an unset field. Do not use.
          - The experiment has expired.
          - The experiment is running and thus used in serving.
          - The experiment is ended, but not yet expired. Serving continues in the original configurations while
            the experiment is ready to call an action.
          readOnly: true
        variantLeader:
          type: string
          description: Output only. The variant leader for the experiment according to some key metrics.
          enum:
          - VARIANT_LEADER_UNSPECIFIED
          - CONTROL
          - TREATMENT
          - INSUFFICIENT_DATA
          - TOO_EARLY_TO_CALL
          - NO_VARIANT_LEADER
          x-enum-descriptions:
          - Default value of the enum. Do not use.
          - The control leading the experiment.
          - The treatment leading the experiment.
          - Collected data (impressions) are insufficient to determine a leader.
          - Experiment hasn't run long enough to determine a leader.
          - Neither variant is a decisive winner in the observed data.
          readOnly: true
    GenerateMediationReportResponse:
      type: object
      description: 'The streaming response for the AdMob Mediation report where the first response contains the
        report header, then a stream of row responses, and finally a footer as the last response message. For example:
        [{ "header": { "date_range": { "start_date": {"year": 2018, "month": 9, "day": 1}, "end_date": {"year":
        2018, "month": 9, "day": 1} }, "localization_settings": { "currency_code": "USD", "language_code": "en-US"
        } } }, { "row": { "dimension_values": { "DATE": {"value": "20180918"}, "APP": { "value": "ca-app-pub-8123415297019784~1001342552",
        "display_label": "My app name!" } }, "metric_values": { "ESTIMATED_EARNINGS": {"decimal_value": "1324746"}
        } } }, { "footer": {"matching_row_count": 1} }]'
      properties:
        row:
          $ref: '#/components/schemas/ReportRow'
        footer:
          $ref: '#/components/schemas/ReportFooter'
        header:
          $ref: '#/components/schemas/ReportHeader'
    ListAppsResponse:
      type: object
      description: Response for the apps list request.
      properties:
        apps:
          type: array
          description: The resulting apps for the requested account.
          items:
            $ref: '#/components/schemas/App'
        nextPageToken:
          type: string
          description: If not empty, indicates that there may be more apps for the request; this value should be
            passed in a new `ListAppsRequest`.
    AdUnit:
      type: object
      description: Describes an AdMob ad unit.
      properties:
        adUnitId:
          type: string
          description: 'The externally visible ID of the ad unit which can be used to integrate with AdMob. This
            is a read only property. Example: ca-app-pub-9876543210987654/0123456789'
        appId:
          type: string
          description: 'The externally visible ID of the app this ad unit is associated with. Example: ca-app-pub-9876543210987654~0123456789'
        displayName:
          type: string
          description: The display name of the ad unit as shown in the AdMob UI, which is provided by the user.
            The maximum length allowed is 80 characters.
        rewardSettings:
          $ref: '#/components/schemas/AdUnitRewardSettings'
        name:
          type: string
          description: 'Resource name for this ad unit. Format is accounts/{publisher_id}/adUnits/{ad_unit_id_fragment}
            Example: accounts/pub-9876543210987654/adUnits/0123456789'
        adTypes:
          type: array
          description: 'Ad media type supported by this ad unit. Possible values as follows: "RICH_MEDIA" - Text,
            image, and other non-video media. "VIDEO" - Video media.'
          items:
            type: string
        adFormat:
          type: string
          description: 'AdFormat of the ad unit. Possible values are as follows: "APP_OPEN" - App Open ad format.
            "BANNER" - Banner ad format. "BANNER_INTERSTITIAL" - Legacy format that can be used as either banner
            or interstitial. This format can no longer be created but can be targeted by mediation groups. "INTERSTITIAL"
            - A full screen ad. Supported ad types are "RICH_MEDIA" and "VIDEO". "NATIVE" - Native ad format. "REWARDED"
            - An ad that, once viewed, gets a callback verifying the view so that a reward can be given to the user.
            Supported ad types are "RICH_MEDIA" (interactive) and video where video can not be excluded. "REWARDED_INTERSTITIAL"
            - Rewarded Interstitial ad format. Only supports video ad type. See https://support.google.com/admob/answer/9884467.'
    AppLinkedAppInfo:
      type: object
      description: Information from the app store if the app is linked to an app store.
      properties:
        androidAppStores:
          type: array
          description: Optional. The app store information for published Android apps. This field is only used for
            apps on the Android platform and will be ignored if the PLATFORM is set to iOS. The default value is
            the Google Play App store. This field can be updated after app is created. If the app is not published,
            this field will not be included in the response.
          items:
