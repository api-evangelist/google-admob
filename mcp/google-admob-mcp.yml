auth:
  model: oauth2
  detail: Any MCP server over the AdMob API must carry a Google OAuth 2.0 USER access token with admob.readonly
    and/or admob.report. AdMob does not support service accounts, so an unattended agent cannot self-authorize
    - a human must consent and the refresh token must be held by the server.
  scopes:
  - https://www.googleapis.com/auth/admob.readonly
  - https://www.googleapis.com/auth/admob.report
