third_party_note: Listed as evidence of demand, not as an AdMob agent surface. None is published or endorsed
  by Google, none was probed for a live endpoint, and none is wired into apis.yml.
agent_cautions:
- The v1beta write tools are not idempotency-protected; a retried create can duplicate an app, ad unit,
  ad unit mapping or mediation group.
- Revenue arrives as ReportRowMetricValue.microsValue (millionths of the account currency), not as a decimal.
- A report request over 100,000 rows fails with 400 INVALID_ARGUMENT rather than paging.
- Quota is per Google Cloud project and there is no Retry-After header; back off on a client-side schedule.
