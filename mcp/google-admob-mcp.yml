notes: 'Google publishes NO first-party MCP server for AdMob. Searched the AdMob developer documentation,
  the Google Ads Developer Blog (which did announce an open-source MCP server - for the Google Ads API,
  a different product), and the public MCP registries on 2026-08-13. Every AdMob MCP server that exists
  is an independent community project, so no MCPServer pointer is wired into apis.yml: that pointer asserts
  the PROVIDER serves an MCP surface, and AdMob does not. The tool list below is a CANDIDATE derived one-to-one
  from the 25 real operations in the OpenAPI this repo converted from Google''s Discovery Document; each
  tool inherits its real input schema from the named source operation.'
