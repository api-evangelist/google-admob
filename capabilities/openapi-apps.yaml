naftiko: 1.0.0-alpha2
info:
  label: Google AdMob API — Apps
  description: 'Google AdMob API — Apps. 1 operations. Lead operation: Google AdMob List apps. Self-contained Naftiko capability
    covering one Google Admob business surface.'
  tags:
  - Google Admob
  - Apps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_ADMOB_API_KEY: GOOGLE_ADMOB_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-apps
    baseUri: https://admob.googleapis.com
    description: Google AdMob API — Apps business capability. Self-contained, no shared references.
    resources:
    - name: v1-parent-apps
      path: /v1/{parent}/apps
      operations:
      - name: listapps
        method: GET
        description: Google AdMob List apps
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_ADMOB_API_KEY}}'
  exposes:
  - type: rest
    namespace: openapi-apps-rest
    port: 8080
    description: REST adapter for Google AdMob API — Apps. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/{parent}/apps
      name: v1-parent-apps
      description: REST surface for v1-parent-apps.
      operations:
      - method: GET
        name: listapps
        description: Google AdMob List apps
        call: openapi-apps.listapps
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-apps-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google AdMob API — Apps. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: google-admob-list-apps
      description: Google AdMob List apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-apps.listapps
      with:
        parent: tools.parent
      outputParameters:
      - type: object
        mapping: $.
