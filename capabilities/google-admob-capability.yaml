naftiko: 1.0.0-alpha2
info:
  label: Google AdMob API
  description: The AdMob API provides programmatic access to AdMob account information, including ad units, apps, ad sources,
    mediation groups, and reporting for mobile app monetization.
  tags:
  - Google
  - Admob
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-admob
    baseUri: https://admob.googleapis.com
    description: Google AdMob API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_ADMOB_TOKEN}}'
    resources:
    - name: v1-accounts
      path: /v1/accounts
      operations:
      - name: listaccounts
        method: GET
        description: Google AdMob List accounts
        inputParameters:
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-adunits
      path: /v1/{parent}/adUnits
      operations:
      - name: listadunits
        method: GET
        description: Google AdMob List ad units
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createadunit
        method: POST
        description: Google AdMob Create ad unit
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-apps
      path: /v1/{parent}/apps
      operations:
      - name: listapps
        method: GET
        description: Google AdMob List apps
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-mediationgroups
      path: /v1/{parent}/mediationGroups
      operations:
      - name: listmediationgroups
        method: GET
        description: Google AdMob List mediation groups
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-networkreport-generate
      path: /v1/{parent}/networkReport:generate
      operations:
      - name: generatenetworkreport
        method: POST
        description: Google AdMob Generate network report
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-admob-rest
    description: REST adapter for Google AdMob API.
    resources:
    - path: /v1/accounts
      name: listaccounts
      operations:
      - method: GET
        name: listaccounts
        description: Google AdMob List accounts
        call: google-admob.listaccounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/adUnits
      name: listadunits
      operations:
      - method: GET
        name: listadunits
        description: Google AdMob List ad units
        call: google-admob.listadunits
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/adUnits
      name: createadunit
      operations:
      - method: POST
        name: createadunit
        description: Google AdMob Create ad unit
        call: google-admob.createadunit
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/apps
      name: listapps
      operations:
      - method: GET
        name: listapps
        description: Google AdMob List apps
        call: google-admob.listapps
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/mediationGroups
      name: listmediationgroups
      operations:
      - method: GET
        name: listmediationgroups
        description: Google AdMob List mediation groups
        call: google-admob.listmediationgroups
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/networkReport:generate
      name: generatenetworkreport
      operations:
      - method: POST
        name: generatenetworkreport
        description: Google AdMob Generate network report
        call: google-admob.generatenetworkreport
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-admob-mcp
    transport: http
    description: MCP adapter for Google AdMob API for AI agent use.
    tools:
    - name: listaccounts
      description: Google AdMob List accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-admob.listaccounts
      with:
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      inputParameters:
      - name: pageSize
        type: integer
        description: pageSize
      - name: pageToken
        type: string
        description: pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: listadunits
      description: Google AdMob List ad units
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-admob.listadunits
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: createadunit
      description: Google AdMob Create ad unit
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-admob.createadunit
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listapps
      description: Google AdMob List apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-admob.listapps
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listmediationgroups
      description: Google AdMob List mediation groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-admob.listmediationgroups
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: generatenetworkreport
      description: Google AdMob Generate network report
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-admob.generatenetworkreport
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    GOOGLE_ADMOB_TOKEN: GOOGLE_ADMOB_TOKEN
