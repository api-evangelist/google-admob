notes: >-
  Google maintains a dated release-notes page for the AdMob API, but it is
  extremely sparse: three entries covering seven years, the most recent from
  September 2023. The page's own "last updated" stamp reads 28 August 2025 with
  no matching entry. The real change signal is elsewhere — the Discovery
  Document carries a `revision` field which read 20260731 for BOTH v1 and
  v1beta when harvested on 2026-08-13, i.e. the contract moved on 31 July 2026
  without a release note. Anyone tracking AdMob API change should diff the
  Discovery Document revision, not watch the changelog. Both snapshots are in
  discovery/ for exactly that purpose.
