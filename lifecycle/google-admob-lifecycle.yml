deprecation:
  published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  notes: >-
    NO deprecation policy is published for the AdMob API. There is no AdMob
    deprecation page, no RFC 8594 Sunset/Deprecation header support, and the
    governing Google APIs Terms of Service (https://developers.google.com/terms,
    fetched 2026-08-13) contains no deprecation-policy section and commits to no
    notice period — its Section 10.a only covers modification of the terms
    themselves. AdMob is also not a Google Cloud Platform service, so the GCP
    deprecation commitments do not apply to it. No AdMob operation is flagged
    `deprecated` in either Discovery Document and no version has been retired to
    date, but a consumer has no contractual warning window. Treat v1beta as the
    unstable channel: breaking change lands there first.
  deprecated_operations: []
