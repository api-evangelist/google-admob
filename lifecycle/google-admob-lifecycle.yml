notes: >-
  AdMob runs two live channels off one host. v1 is the stable, entirely READ-ONLY
  channel — six methods, unchanged since April 2021. v1beta carries the whole
  write surface (create app / ad unit / ad unit mapping / mediation group, patch
  mediation group, create and stop mediation A/B experiments) plus campaign
  reporting and ad-source discovery, and has been in beta since September 2023
  with no announced GA date. Both Discovery Documents carried revision 20260731
  when harvested on 2026-08-13, so both channels are actively maintained even
  where the release notes are quiet.
