aid: google-admob
name: Google AdMob
description: >-
  AdMob is Google's mobile app advertising and monetization platform, letting app publishers earn revenue
  through in-app ads (banner, interstitial, rewarded, rewarded interstitial, native and app open formats),
  maximize fill rate and eCPM with AdMob Mediation and open bidding across many ad networks, and understand
  performance through reporting. The AdMob API (admob.googleapis.com) provides programmatic access to AdMob
  account data, apps, ad units, ad sources and adapters, ad unit mappings, mediation groups and mediation
  A/B experiments, plus network, mediation and campaign performance reports, over REST/JSON authorized with
  Google OAuth 2.0 user tokens using the admob.readonly and admob.report scopes. Service accounts are not
  supported. The stable v1 channel is entirely read-only; the v1beta channel carries the whole write surface.
  Google publishes no OpenAPI for AdMob — the first-party machine-readable contract is a Google Discovery
  Document served by the API host itself, alongside a protobuf IDL in googleapis/googleapis.
