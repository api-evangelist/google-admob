  converted OpenAPI (50 schemas on v1beta, 29 on v1). AdMob's model is a strict
  hierarchy hanging off PublisherAccount, expressed through Google resource
  names rather than foreign-key objects — most relationships are carried as a
  string id field (appId, adUnitId, adSourceId, adapterId, mediationGroupId), so
