reporting_model:
  note: >-
    Reports are a request/response projection, not an entity. Each :generate
    method posts a report specification and returns a row stream.
  specifications:
  - name: NetworkReportSpec
    operation: accounts_networkReport_generate
    fields: [dateRange, dimensions, metrics, dimensionFilters, sortConditions, maxReportRows, timeZone, localizationSettings]
    versions: [v1, v1beta]
