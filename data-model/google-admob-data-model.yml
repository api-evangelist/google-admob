    operation: accounts_campaignReport_generate
    fields: [dateRange, dimensions, metrics, languageCode]
    versions: [v1beta]
  row_shape:
    header: ReportHeader (dateRange, reportingTimeZone, localizationSettings)
    row: ReportRow (dimensionValues -> ReportRowDimensionValue, metricValues -> ReportRowMetricValue)
    footer: ReportFooter (matchingRowCount, warnings -> ReportWarning)
  metric_value_note: >-
    ReportRowMetricValue is a oneof — integerValue, doubleValue or microsValue.
    Revenue arrives as microsValue (millionths of the account currency); a
    consumer that reads doubleValue for earnings will silently get nothing.
