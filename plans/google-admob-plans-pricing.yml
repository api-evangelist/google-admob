description: >-
  Commercial model for the Google AdMob API. This file REPLACES the 2026-05-04
  bulk-sweep scaffold, which asserted a priced "Free" tier with a 1,000
  requests/month quota. Google publishes no such tier and no such number; the
  scaffold was invented.
tags:
- AdMob
- App Monetization
- Pricing
plan_count: 0
plans: []
notes: >-
  AdMob publishes no priced API plans, no tiers and no metered API billing.
  AdMob is a publisher-monetization product where the money flows the other way:
  app publishers are PAID by Google out of a revenue share on ads served, and
  they do not buy API access. The AdMob API (admob.googleapis.com) is free to any
  AdMob publisher who enables it on a Google Cloud project; the only consumption
  control is the published per-project quota (see
  rate-limits/google-admob-rate-limits.yml), and extra daily quota is requested
  through the AdMob API developer forum with a use case rather than purchased.
  No authoritative AdMob revenue-share percentage page is published the way one
  is for AdSense, so no revenue-share figure is recorded here.
commercial_model:
  type: revenue-share
  direction: provider-pays-publisher
  api_billing: none
  api_access: Free with per-project quota; enable admob.googleapis.com in the Google API Console.
  signup: https://admob.google.com/home/get-started/
evidence:
- url: https://developers.google.com/admob/api/quotas
  status: 200
  note: Documents quota only. No price, no metering, no billing for AdMob API calls.
- url: https://admob.google.com/home/
  status: 200
  note: Product site markets earnings to publishers; there is no pricing or plans page.
