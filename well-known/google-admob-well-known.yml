source: live GET of every /.well-known/ path on every host in apis.yml and every OpenAPI servers[] host
notes: >-
  The AdMob API host (admob.googleapis.com) and the AdMob developer/product hosts
  serve NOTHING at /.well-known/ — every path returns a Google 404 page. The
  well-known surface that is real for this API belongs to two other Google hosts
  that this API genuinely depends on: www.google.com serves the corporate RFC 9116
  security.txt (the vulnerability-disclosure contact for AdMob), and
  accounts.google.com serves the OIDC discovery + RFC 8414 authorization-server
  metadata for the OAuth 2.0 authorization server every AdMob API call
  authenticates against (its authorizationUrl/tokenUrl are exactly the ones the
  Discovery Document declares). Both are recorded here with the host they were
  served from, so the record never implies admob.googleapis.com serves them.
